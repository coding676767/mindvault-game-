 text-shadow:0 1px 0 #1b6e8c,0 2px 0 #19627d,0 3px 0 #165670,0 4px 0 #134a62,0 5px 0 #103e54,0 14px 30px rgba(57,208,255,.6)}

/* ---------- 3D animated background ---------- */

  const geos = [new THREE.IcosahedronGeometry(1.4), new THREE.OctahedronGeometry(1.5), new THREE.BoxGeometry(1.8, 1.8, 1.8),

  const cols = [0x39d0ff, 0xff4fd8, 0x8b5cf6, 0xffd166, 0x34d399];
  const meshes = [];
  for (let i = 0; i < 34; i++) {
    const c = pick(cols);
    const m = new THREE.Mesh(pick(geos), new THREE.MeshStandardMaterial({ color: c, emissive: c, emissiveIntensity: 0.18, roughness: 0.3, metalness: 0.6, wireframe: Math.random() < 0.5 }));

    const s = 0.6 + Math.random() * 1.2; m.scale.set(s, s, s);

  const resize = () => { r.setSize(innerWidth, innerHeight, false); cam.aspect = innerWidth / innerHeight; cam.updateProjectionMatrix(); };
  addEventListener('resize', resize); resize();

    cam.position.y += (-my * 5 - cam.position.y) * 0.04;
    cam.lookAt(0, 0, 0);

/* ---------- reusable 3D cube viewer (drag to rotate) ---------- */
function makeViewer(api, size, camZ = 12) {

      m.position.set(p[0] - cx, p[1] - cy, p[2] - cz);
      m.add(new THREE.LineSegments(edges, lmat));
      group.add(m);
    });

  return { c, group, setCubes };
}

/* ---------- shared UI helpers for games ---------- */
function choices(stage, api, opts, ansIdx, render) {
  const box = h('div', 'choices');
  opts.forEach((o, i) => {
    const b = h('button', 'opt');
    if (render) b.append(render(o)); else b.textContent = o;
    b.onclick = () => {
      if (api.locked) return;
      b.classList.add(i === ansIdx ? 'good' : 'bad');
      if (i !== ansIdx) box.children[ansIdx].classList.add('good');
      api.answer(i === ansIdx);
    };
    box.append(b);
  });
  stage.append(box);
  api.ans = render ? null : opts[ansIdx];
  api.reveal = () => box.children[ansIdx].classList.add('good');

}
function numOptions(ans, spread = 6) {

/* ---------- 3D polycube maths (for mental rotation) ---------- */
const rotX = ([x, y, z]) => [x, -z, y], rotY = ([x, y, z]) => [z, y, -x], rotZ = ([x, y, z]) => [-y, x, z];

/* ---------- matrix puzzle drawing ---------- */
const SHAPES = ['circle', 'square', 'triangle'], COLORS = ['#ff5a7a', '#4ade80', '#60a5fa'];

  ['Which comes next: 1, 1, 2, 3, 5, 8, ?', ['11', '12', '13', '15'], 2]
];
const INK = [['RED', '#ff4d6d'], ['BLUE', '#4dabff'], ['GREEN', '#3ddc84'], ['YELLOW', '#ffd166'], ['PURPLE', '#b388ff'], ['ORANGE', '#ff9f43']];

/* ---------- the 10 games ---------- */
const GAMES = [
  { id: 'pattern', icon: '🟦', name: 'Pattern Recall', tag: 'Memory', desc: 'Watch the tiles light up, then repeat the sequence.',
    round(stage, api, r) {
      const len = 3 + Math.floor(r / 2), seq = [];
      for (let i = 0; i < len; i++) { let v; do { v = rnd(0, 8); } while (v === seq[i - 1]); seq.push(v); }
      const info = h('div', 'hint', 'Watch the pattern…'), grid = h('div', 'pgrid'), tiles = [];
      for (let i = 0; i < 9; i++) { const t = h('div', 'tile'); tiles.push(t); grid.append(t); }
      stage.append(info, grid);
      api.ans = null; let input = [], accept = false;
      (async () => {
        await sleep(600);
        for (const i of seq) { if (api.dead) return; tiles[i].classList.add('lit'); await sleep(450); tiles[i].classList.remove('lit'); await sleep(200); }
        info.textContent = 'Your turn — repeat it!'; accept = true;
      })();
      tiles.forEach((t, i) => t.onclick = () => {
        if (!accept) return;
        t.classList.add('lit'); setTimeout(() => t.classList.remove('lit'), 160);
        input.push(i);
        if (i !== seq[input.length - 1]) { accept = false; api.answer(false); }
        else if (input.length === len) { accept = false; api.answer(true); }
      });
    } },

  { id: 'sequence', icon: '🔢', name: 'Number Sequence', tag: 'Logic', desc: 'Find the number that continues the pattern.', time: 25,
    round(stage, api, r) {
      const t = r < 3 ? rnd(0, 1) : rnd(0, 5); let s = [];
      if (t === 0) { const a = rnd(1, 20), d = rnd(2, 9); for (let i = 0; i < 6; i++) s.push(a + d * i); }
      else if (t === 1) { const a = rnd(1, 5), m = rnd(2, 3); for (let i = 0; i < 6; i++) s.push(a * m ** i); }
      else if (t === 2) { let v = rnd(1, 6); const d = rnd(1, 3); for (let i = 0; i < 6; i++) { s.push(v); v += d * (i + 1); } }
      else if (t === 3) { const n = rnd(1, 5), k = rnd(0, 4); for (let i = 0; i < 6; i++) s.push((n + i) ** 2 + k); }
      else if (t === 4) { s = [rnd(1, 5), rnd(2, 6)]; while (s.length < 6) s.push(s[s.length - 1] + s[s.length - 2]); }
      else { const a = rnd(1, 10), b = rnd(20, 40), d = rnd(2, 5), e = rnd(2, 6); for (let i = 0; i < 6; i++) s.push(i % 2 === 0 ? a + (i / 2) * d : b + ((i - 1) / 2) * e); }
      const ans = s[5], opts = numOptions(ans, 8);
      stage.append(h('div', 'hint', 'What comes next?'), h('div', 'q', s.slice(0, 5).join(' , ') + ' , <span style="color:var(--b)">?</span>'));
      choices(stage, api, opts, opts.indexOf(ans));
    } },

  { id: 'math', icon: '➗', name: 'Speed Math', tag: 'Numeracy', desc: 'Solve mental arithmetic before the clock runs out.', time: r => Math.max(8, 14 - Math.floor(r / 2)),
    round(stage, api, r) {
      let txt, ans;
      if (r < 3) { const a = rnd(12, 89), b = rnd(11, 60); if (Math.random() < .5) { txt = `${a} + ${b}`; ans = a + b; } else { txt = `${a + b} − ${b}`; ans = a; } }
      else if (r < 6) { const a = rnd(3, 12), b = rnd(3, 12), c = rnd(5, 40); if (Math.random() < .5) { txt = `${a} × ${b}`; ans = a * b; } else { txt = `${a} × ${b} + ${c}`; ans = a * b + c; } }
      else { const a = rnd(3, 15), b = rnd(2, 12), c = rnd(2, 9); const k = rnd(0, 2); if (k === 0) { txt = `(${a} + ${b}) × ${c}`; ans = (a + b) * c; } else if (k === 1) { txt = `${a * c} ÷ ${c} + ${b} × ${c}`; ans = a + b * c; } else { txt = `${a} × ${b} − ${c} × ${c}`; ans = a * b - c * c; } }
      const opts = numOptions(ans, 10);
      stage.append(h('div', 'hint', 'Solve it fast!'), h('div', 'q', txt + ' = ?'));
      choices(stage, api, opts, opts.indexOf(ans));
    } },

  { id: 'odd', icon: '🎨', name: 'Odd One Out', tag: 'Perception', desc: 'Spot the tile with the slightly different shade.', time: 12,
    round(stage, api, r) {
      const n = r < 3 ? 3 : r < 6 ? 4 : 5, hue = rnd(0, 359), diff = Math.max(6, 22 - r * 2), odd = rnd(0, n * n - 1);
      stage.append(h('div', 'hint', 'Tap the different tile'));
      const g = h('div', 'ogrid'); g.style.gridTemplateColumns = `repeat(${n},1fr)`;
      for (let i = 0; i < n * n; i++) {
        const b = h('button', 'otile'); b.style.background = `hsl(${hue},70%,${i === odd ? 55 + diff : 55}%)`;
        b.onclick = () => { if (api.locked) return; if (i !== odd) g.children[odd].style.outline = '4px solid #34d399'; api.answer(i === odd); };
        g.append(b);
      }
      stage.append(g); api.ans = null;
      api.reveal = () => g.children[odd].style.outline = '4px solid #34d399';
    } },

  { id: 'rotation', icon: '🧊', name: '3D Rotation', tag: 'Spatial · 3D', desc: 'Are these two 3D shapes identical or mirror images? Drag to rotate!', time: 50,
    round(stage, api, r) {
      const n = 5 + (r >= 4 ? 1 : 0) + (r >= 8 ? 1 : 0), { pts, rots } = randShape(n);
      const same = Math.random() < 0.5;
      const A = pts, B = pick([...(same ? rots : allRots(mirror(pts))).values()]);
      const size = Math.min(220, Math.floor((innerWidth - 70) / 2));
      const v1 = makeViewer(api, size, 11), v2 = makeViewer(api, size, 11);
      v1.setCubes(A, () => 0xffa94d); v2.setCubes(B, () => 0xffa94d);
      const row = h('div', 'vrow');
      [['Shape A', v1], ['Shape B', v2]].forEach(([l, v]) => { const w = h('div', 'vwrap'); w.append(v.c, h('div', '', l)); row.append(w); });
      stage.append(h('div', 'hint', 'Drag each shape to rotate it. Is B the same as A, or a mirror image?'), row);
      const box = h('div', 'choices');
      [['Same shape', true], ['Mirror image', false]].forEach(([lab, val]) => {
        const b = h('button', 'opt', lab);
        b.onclick = () => { if (api.locked) return; b.classList.add(val === same ? 'good' : 'bad'); if (val !== same) box.children[same ? 0 : 1].classList.add('good'); api.answer(val === same); };
        box.append(b);
      });
      stage.append(box); api.ans = null; api.reveal = () => box.children[same ? 0 : 1].classList.add('good');
    } },

  { id: 'matrix', icon: '🧩', name: 'Matrix Logic', tag: 'Abstract', desc: 'Find the missing piece in the 3×3 pattern grid.', time: 45,
    round(stage, api, r) {
      const attrs = ['shape', 'count', 'color'], modes = {};
      const sh = shuffle(attrs);
      if (r < 4) { modes[sh[0]] = 'row'; modes[sh[1]] = 'col'; modes[sh[2]] = 'fixed'; }
      else { const m = shuffle(['row', 'col', 'sum']); sh.forEach((a, i) => modes[a] = m[i]); }
      const fixedVal = rnd(0, 2), perm = {}; attrs.forEach(a => perm[a] = shuffle([0, 1, 2]));
      const val = (a, rr, cc) => { const m = modes[a]; const i = m === 'row' ? rr : m === 'col' ? cc : m === 'sum' ? (rr + cc) % 3 : fixedVal; return perm[a][i]; };
      const cell = (rr, cc) => ({ shape: val('shape', rr, cc), count: val('count', rr, cc), color: val('color', rr, cc) });
      const draw = c => shapeSVG(SHAPES[c.shape], c.count + 1, COLORS[c.color]);
      const key = c => `${c.shape}${c.count}${c.color}`;
      const ans = cell(2, 2), opts = [ans], seen = new Set([key(ans)]);
      let guard = 0;
      while (opts.length < 4 && guard++ < 100) { const c = { ...ans }; const a = pick(attrs); c[a] = (c[a] + rnd(1, 2)) % 3; if (!seen.has(key(c))) { seen.add(key(c)); opts.push(c); } }
      const order = shuffle(opts), ansIdx = order.indexOf(ans);
      const g = h('div', 'mgrid');
      for (let rr = 0; rr < 3; rr++) for (let cc = 0; cc < 3; cc++) g.append(rr === 2 && cc === 2 ? h('div', 'mcell', '?') : h('div', 'mcell', draw(cell(rr, cc))));
      stage.append(h('div', 'hint', 'Which piece completes the grid?'), g);
      choices(stage, api, order, ansIdx, c => { const d = h('div'); d.innerHTML = draw(c); return d.firstChild; });
    } },

  { id: 'words', icon: '🔤', name: 'Word Scramble', tag: 'Verbal', desc: 'Unscramble the letters to reveal the hidden word.', time: 30,
    round(stage, api, r) {
      const w = pick(r < 3 ? WORDS.easy : r < 6 ? WORDS.mid : WORDS.hard);
      let sc; do { sc = shuffle(w.split('')).join(''); } while (sc === w);
      const L = h('div', 'letters'); sc.split('').forEach(c => L.append(h('b', '', c.toUpperCase())));
      const inp = h('input', 'tin'); inp.placeholder = 'type the word'; inp.autocomplete = 'off'; inp.autocapitalize = 'off';
      const go = h('button', 'btn', 'Submit');
      const submit = () => { if (api.locked) return; api.answer(inp.value.trim().toLowerCase() === w); };
      inp.addEventListener('keydown', e => { if (e.key === 'Enter') submit(); }); go.onclick = submit;
      stage.append(h('div', 'hint', 'Unscramble the word'), L, inp, go);
      api.ans = w.toUpperCase(); setTimeout(() => inp.focus(), 50);
    } },

  { id: 'stroop', icon: '🌈', name: 'Colour Clash', tag: 'Focus', desc: 'Pick the ink colour — not what the word says!', time: r => r < 5 ? 6 : 4,
    round(stage, api, r) {
      const word = pick(INK); let ink; do { ink = pick(INK); } while (Math.random() < 0.9 && ink === word);
      const w = h('div', 'stroop', word[0]); w.style.color = ink[1];
      stage.append(h('div', 'hint', 'What COLOUR is the text?'), w);
      const others = shuffle(INK.filter(x => x !== ink)).slice(0, 3), opts = shuffle([ink, ...others]);
      choices(stage, api, opts.map(o => o[0]), opts.indexOf(ink));
    } },

  { id: 'logic', icon: '🧠', name: 'Logic Riddles', tag: 'Reasoning', desc: 'Syllogisms, analogies and classic brain-teasers.', time: 30,
    setup(api) { api.bank = shuffle(LOGIC).slice(0, 10); },
    round(stage, api, r) {
      const [q, o, a] = api.bank[r], ordered = shuffle(o.map((t, i) => [t, i === a])), idx = ordered.findIndex(x => x[1]);
      const qq = h('div', 'q', q); qq.style.fontSize = 'clamp(17px,4vw,24px)';
      stage.append(qq); choices(stage, api, ordered.map(x => x[0]), idx);
    } },

  { id: 'count', icon: '📦', name: 'Cube Counter', tag: 'Spatial · 3D', desc: 'Count every cube in the 3D stack — even the hidden ones.', time: 45,
    round(stage, api, r) {
      const n = r < 3 ? 3 : 4, maxH = r < 3 ? 2 : r < 6 ? 3 : 4; let pts, hs;
      do { hs = []; pts = []; for (let x = 0; x < n; x++) for (let z = 0; z < n; z++) { const hh = rnd(0, maxH); for (let y = 0; y < hh; y++) pts.push([x, y, z]); } } while (pts.length < 5);
      const total = pts.length, size = Math.min(300, innerWidth - 70);
      const v = makeViewer(api, size, 13);
      v.setCubes(pts, p => THREE ? new THREE.Color().setHSL(0.52 + p[1] * 0.09, 0.75, 0.55) : 0);
      stage.append(h('div', 'hint', 'Drag to rotate. How many cubes in total? (Stacks have no gaps underneath.)'), v.c);
      const opts = numOptions(total, 4); choices(stage, api, opts, opts.indexOf(total));
    } }
];

/* ---------- game framework ---------- */
let cur = null, api = null;
const best = () => JSON.parse(localStorage.getItem('nc_best') || '{}');

function renderHub() {
  const b = best(), grid = $('#grid'); grid.innerHTML = '';
  GAMES.forEach(g => {
    const c = h('div', 'card glass');
    c.innerHTML = `<div class="ico">${g.icon}</div><h3>${g.name}</h3><p>${g.desc}</p><div class="meta"><span class="pill">${g.tag}</span><span class="best">${b[g.id] != null ? '🏆 ' + b[g.id] : 'New'}</span></div>`;
    c.onclick = () => startGame(g);
    c.addEventListener('pointermove', e => { const r = c.getBoundingClientRect(), x = (e.clientX - r.left) / r.width - .5, y = (e.clientY - r.top) / r.height - .5; c.style.transform = `rotateY(${x * 22}deg) rotateX(${-y * 22}deg) translateZ(14px)`; });
    c.addEventListener('pointerleave', () => c.style.transform = '');
    grid.append(c);
  });
  const vals = Object.values(b);
  if (vals.length >= 3) { const avg = vals.reduce((s, v) => s + v, 0) / vals.length; $('#iqNum').textContent = Math.round(75 + avg * 0.65); $('#iqNote').textContent = `Based on your best scores across ${vals.length}/10 games. Play more for a better estimate!`; }
  else { $('#iqNum').textContent = '--'; $('#iqNote').textContent = `Play ${3 - vals.length} more game${3 - vals.length === 1 ? '' : 's'} to unlock your score`; }
}

function startGame(g) {
  cur = g;
  $('#hub').classList.add('hidden'); $('#game').classList.remove('hidden'); $('#modal').classList.add('hidden');
  $('#gTitle').textContent = g.icon + ' ' + g.name;
  $('#tbar').parentElement.style.visibility = g.time ? 'visible' : 'hidden';
  api = {
    dead: false, locked: false, score: 0, round: 0, total: 10, timerId: 0, cleans: [], ans: null, reveal: null,
    hud() { $('#gRound').textContent = `Round ${Math.min(this.round + 1, this.total)} / ${this.total}`; $('#gScore').textContent = this.score; $('#bar').style.width = (this.round / this.total * 100) + '%'; },
    onClean(f) { this.cleans.push(f); },
    runClean() { this.cleans.forEach(f => f()); this.cleans = []; this.reveal = null; this.ans = null; },
    startTimer(sec) {
      this.stopTimer(); const t0 = performance.now(), bar = $('#tbar'); bar.style.opacity = 1;
      const tick = () => { if (this.dead) return; const p = (performance.now() - t0) / (sec * 1000); bar.style.width = Math.max(0, 100 - p * 100) + '%'; if (p >= 1) this.answer(false, true); else this.timerId = requestAnimationFrame(tick); };
      this.timerId = requestAnimationFrame(tick);
    },
    stopTimer() { cancelAnimationFrame(this.timerId); $('#tbar').style.opacity = .2; },
    async answer(ok, timeUp) {
      if (this.locked || this.dead) return; this.locked = true; this.stopTimer();
      if (ok) this.score += 10; else if (this.reveal) this.reveal();
      const fb = $('#fb'); fb.className = ok ? 'ok' : 'bad';
      fb.textContent = ok ? '✔ Correct!' : (timeUp ? '⏱ Time up!' : '✘ Not quite') + (this.ans != null ? ' — answer: ' + this.ans : '');
      this.round++; this.hud();
      await sleep(ok ? 650 : 1300); if (this.dead) return;
      if (this.round >= this.total) return finish();
      nextRound();
    }
  };
  if (g.setup) g.setup(api);
  api.hud(); nextRound();
}

function nextRound() {
  api.runClean(); api.locked = false;
  $('#stage').innerHTML = ''; $('#fb').textContent = ''; $('#fb').className = '';
  cur.round($('#stage'), api, api.round);
  api.hud();
  if (cur.time) api.startTimer(typeof cur.time === 'function' ? cur.time(api.round) : cur.time);
}

function finish() {
  api.stopTimer(); api.runClean();
  const b = best(); if (b[cur.id] == null || api.score > b[cur.id]) b[cur.id] = api.score;
  localStorage.setItem('nc_best', JSON.stringify(b));
  const s = api.score;
  $('#mTitle').textContent = s >= 90 ? '🏆 Genius level!' : s >= 70 ? '🔥 Sharp mind!' : s >= 40 ? '👍 Nice work!' : '💪 Keep training!';
  $('#mScore').textContent = s + '/100';
  $('#mMsg').textContent = `Personal best: ${b[cur.id]}/100`;
  $('#modal').classList.remove('hidden');
}

function toMenu() {
  if (api) { api.dead = true; api.stopTimer(); api.runClean(); }
  $('#modal').classList.add('hidden'); $('#game').classList.add('hidden'); $('#hub').classList.remove('hidden');
  renderHub();
}
$('#backBtn').onclick = toMenu;
$('#toMenu').onclick = toMenu;
$('#again').onclick = () => { api.dead = true; startGame(cur); };
$('#resetBtn').onclick = () => { if (confirm('Reset all your scores?')) { localStorage.removeItem('nc_best'); renderHub(); } };
renderHub();
</script>
</body>
</html>
